name: Release

# On a version tag (v1.2.3), publishes a GitHub Release with the brand kit
# attached. The website installs this repo by tag, so the tag is the
# release; this workflow only adds the notes and the download.
#
# Refuses a tag that is not on `main`, that does not match the version in
# package.json, or that has no section in CHANGELOG.md. If someone has
# already created the release in the GitHub UI, it attaches the kit to it.
#
# Release steps: README.md, "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - run: node scripts/build-kit.mjs

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kit="_kit/scpf-brand-kit-${GITHUB_REF_NAME#v}.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$kit" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$kit" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
