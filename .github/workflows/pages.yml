name: Pages

# Publishes the style guide to GitHub Pages: https://brand.stantonfoundation.org
#
# The custom domain is a repo setting (Settings > Pages), not a CNAME file:
# a Pages site deployed by Actions ignores the file. DNS is a CNAME from
# brand.stantonfoundation.org to stantonfoundation.github.io in the
# foundation's Cloudflare account, DNS only (not proxied), so GitHub can
# issue the HTTPS certificate.
#
# Called by build.yml after the `build` check passes on a push to `main`,
# so a change that fails the checks is never published. Can also be run
# by hand from the Actions tab on `main`.
#
# scripts/build-pages.mjs assembles _site/. It has no dependencies, so
# this workflow installs nothing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: node scripts/build-pages.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
